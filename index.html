<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Héraclès · Pilotage</title>
<link rel="stylesheet" href="style.css">
<!-- Client Supabase officiel, via CDN, pas de bundler -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="app-title">
    <span class="h1">Héraclès</span>
    <span class="subtitle">Pilotage</span>
  </div>
  <div class="global-indicator">
    <div class="label">Avancement global</div>
    <div class="value" id="global-value">—</div>
  </div>
  <div id="user-zone" class="user-zone"></div>
</header>

<main id="app-main">
  <!-- Écran de connexion, remplacé dynamiquement une fois authentifié -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-form">
      <h2>Connexion</h2>
      <label>
        Email
        <input type="email" id="login-email" name="email" required autocomplete="email">
      </label>
      <label>
        Mot de passe
        <div class="password-wrap">
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
          <button type="button" id="toggle-password" aria-label="Afficher le mot de passe">Afficher</button>
        </div>
      </label>
      <button type="submit" class="btn btn-primary">Se connecter</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>

  <div id="content-screen" class="content-screen" hidden>
    <nav class="view-nav">
      <button data-view="overview" class="active">Vue d'ensemble</button>
      <button data-view="priorite">Priorités d'action</button>
      <button data-view="projets">Projets</button>
      <button data-view="synthese">Synthèse chiffrée</button>
    </nav>
    <div id="view-slot"></div>
  </div>
</main>

<div class="tooltip-root"></div>

<footer class="app-footer">
  <button id="version-btn" class="version-btn">v<span id="footer-version">…</span></button>
  <div id="changelog-panel" class="changelog-panel" hidden></div>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
