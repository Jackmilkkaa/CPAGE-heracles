<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Héraclès · Pilotage</title>
<link rel="stylesheet" href="style.css">
<!-- Client Supabase officiel, via CDN, pas de bundler -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="app-title">
    <img class="logo" src="assets/cpage-logo.png" alt="CPage">
    <span class="sep" aria-hidden="true"></span>
    <span class="h1">Héraclès</span>
    <span class="subtitle">Pilotage</span>
  </div>
  <div class="global-indicator">
    <div class="label">Avancement global</div>
    <div class="value" id="global-value">—</div>
  </div>
  <div id="user-zone" class="user-zone"></div>
</header>

<main id="app-main">
  <!-- Écran de connexion, remplacé dynamiquement une fois authentifié -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-form">
      <h2>Connexion</h2>
      <label>
        Email
        <input type="email" id="login-email" name="email" required autocomplete="email">
      </label>
      <label>
        Mot de passe
        <div class="password-wrap">
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
          <button type="button" id="toggle-password" aria-label="Afficher le mot de passe">Afficher</button>
        </div>
      </label>
      <button type="submit" class="btn btn-primary">Se connecter</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>

  <div id="content-screen" class="content-screen" hidden>
    <nav class="view-nav">
      <button data-view="overview" class="active"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Vue d'ensemble</span></button>
      <button data-view="priorite"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>Priorités d'action</span></button>
      <button data-view="projets"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect x="2" y="6" width="20" height="14" rx="2"/></svg><span>Projets</span></button>
      <button data-view="synthese"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M12 3v18"/></svg><span>Synthèse chiffrée</span></button>
    </nav>
    <div id="view-slot"></div>
  </div>
</main>

<div class="tooltip-root"></div>

<footer class="app-footer">
  <button id="version-btn" class="version-btn">v<span id="footer-version">…</span></button>
  <div id="changelog-panel" class="changelog-panel" hidden></div>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
